    <script src="../js/sidebar.js"></script>
    <script>
        const SUPABASE_URL = 'https://dgwuzhngmrksrtdrmjvm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_fMMt5IGPP8ub6Ys-QfRD4Q_OEse9xv1';

        const CATEGORY_LABELS = {
            'security': '🛡️ 安全研究',
            'binary': '💻 二进制/Pwn',
            'web-security': '🌐 Web安全'
        };

        async function getViews(paths) {
            try {
                const pathList = paths.map(p => encodeURIComponent(p)).join(',');
                const response = await fetch(`${SUPABASE_URL}/rest/v1/views?path=in.(${pathList})`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                const data = await response.json();
                const viewsMap = {};
                data.forEach(item => {
                    viewsMap[item.path] = item.count || 0;
                });
                return viewsMap;
            } catch (error) {
                console.error('获取阅读量失败:', error);
                return {};
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const params = new URLSearchParams(window.location.search);
            const category = params.get('category') || 'binary';
            const slug = params.get('series') || '';
            const listContainer = document.getElementById('series-articles');

            document.getElementById('crumb-category').textContent = CATEGORY_LABELS[category] || category;
            document.getElementById('crumb-category').href = `${category}.html`;
            document.getElementById('nav-category-link').textContent = CATEGORY_LABELS[category] || '分类';
            document.getElementById('nav-category-link').href = `${category}.html`;
            document.getElementById('series-meta').innerHTML = `返回 <a href="${category}.html">${CATEGORY_LABELS[category] || category}</a> 列表`;

            try {
                const [seriesList, posts] = await Promise.all([
                    fetch(`../content/${category}/series.json?t=${Date.now()}`).then(r => r.ok ? r.json() : []),
                    fetch(`../content/${category}/index.json?t=${Date.now()}`).then(r => r.json())
                ]);

                const series = (Array.isArray(seriesList) ? seriesList : []).find(item => item.slug === slug);

                if (!series) {
                    document.getElementById('series-title').textContent = '专栏不存在';
                    document.getElementById('series-summary').textContent = '';
                    listContainer.innerHTML = `
                        <div class="text-center py-4 text-muted">
                            没有找到这个专栏（${escapeHtml(category)} / ${escapeHtml(slug)}）。
                            <a href="${category}.html">返回分类页</a>
                        </div>`;
                    return;
                }

                document.title = `${series.title} - AllKeyboardCx`;
                document.getElementById('crumb-series').textContent = series.title;
                document.getElementById('series-title').textContent = `📚 ${series.title}`;
                document.getElementById('series-summary').textContent = series.summary || '';

                const paths = series.articles.map(article => `${category}/${article.filename}`);
                const viewsMap = await getViews(paths);

                listContainer.innerHTML = series.articles.map(article => {
                    const views = viewsMap[`${category}/${article.filename}`] || 0;
                    const tags = (article.tags || []).map(tag => `#${tag}`).join(' ');
                    return `
                        <a href="article.html?category=${encodeURIComponent(category)}&file=${encodeURIComponent(article.filename)}" class="list-group-item list-group-item-action bg-dark text-light border-gray">
                            <div class="d-flex w-100 justify-content-between">
                                <h5 class="mb-1">${escapeHtml(article.title)}</h5>
                                <small class="text-muted">${escapeHtml(article.date)}</small>
                            </div>
                            <p class="mb-1">${escapeHtml(article.summary || '')}</p>
                            <div class="d-flex w-100 justify-content-between">
                                <small class="text-muted">${escapeHtml(tags)}</small>
                                <small class="text-muted">阅读量: ${views}</small>
                            </div>
                        </a>`;
                }).join('');

                document.getElementById('series-count').textContent = series.articles.length;
                const totalViews = series.articles.reduce((sum, article) => {
                    return sum + (viewsMap[`${category}/${article.filename}`] || 0);
                }, 0);
                document.getElementById('series-views').textContent = totalViews.toLocaleString();

                const allTags = posts.reduce((tags, post) => [...tags, ...(post.tags || [])], []);
                const tagCounts = {};
                allTags.forEach(tag => { tagCounts[tag] = (tagCounts[tag] || 0) + 1; });
                document.getElementById('tag-cloud').innerHTML = Object.entries(tagCounts).map(([tag, count]) =>
                    `<a href="search.html?q=${encodeURIComponent(tag)}" class="badge bg-secondary me-1 mb-1 text-decoration-none">${escapeHtml(tag)} (${count})</a>`
                ).join('');
            } catch (error) {
                console.error('加载专栏失败:', error);
                listContainer.innerHTML = `
                    <div class="text-center py-4 text-muted">
                        加载专栏失败: ${escapeHtml(error.message)}
                    </div>`;
            }
        });
    </script>
    <script src="../js/stars.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
